<!DOCTYPE html>
<html lang="es-MX">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--porcelain:#F6F4EE;--ink:#161512;--klein:#2B36E8}
body{margin:0;font-family:'Geist',sans-serif;background:var(--porcelain);color:var(--ink);
  min-height:100svh;display:grid;place-items:center;text-align:center;padding:2rem}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(4rem,15vw,9rem);margin:0;line-height:1}
h1 em{color:var(--klein)}
p{color:rgba(22,21,18,.6);max-width:28rem;margin:1rem auto 2rem}
a{display:inline-block;text-decoration:none;color:var(--porcelain);background:var(--ink);
  padding:.95rem 1.8rem;border-radius:999px;font-weight:500;transition:background .3s}
a:hover{background:var(--klein)}
.mono{font-family:monospace;font-size:.7rem;letter-spacing:.2em;color:rgba(22,21,18,.3);text-transform:uppercase}
</style>

<!-- SEO:GENERATED -->
<title>Página no encontrada | WorldBrain México</title>
<meta name="description" content="La página solicitada no existe o fue movida.">
<meta name="robots" content="noindex,follow">
<meta name="googlebot" content="noindex,follow">
<!-- /SEO:GENERATED -->

</head>
<body>
<main>
  <span class="mono">Error 404</span>
  <h1>Hasta nosotros <em>olvidamos algo.</em></h1>
  <p>Irónico para una escuela de memoria, lo sabemos. Esta página no existe — pero tus 16 programas te esperan en el inicio.</p>
  <a href="/">← Volver al inicio</a>
</main>
</body>
</html>
